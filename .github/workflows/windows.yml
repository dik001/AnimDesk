name: Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Rust MSVC
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --no-self-update
      - run: rustup override set 1.94.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e -- --workers=1 --timeout=60000
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -ne $version) { throw 'Package and application versions differ' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag does not match application version'
          }
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/AnimDesk_${version}_x64-setup.exe"
          if (!(Test-Path -LiteralPath $installer) -or (Get-Item -LiteralPath $installer).Length -eq 0) {
            throw 'NSIS installer is missing or empty'
          }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AnimDesk-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AnimDesk-windows-x64
          path: installer
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          installer="installer/AnimDesk_${version}_x64-setup.exe"
          test -s "$installer"
          printf '%s\n' \
            'Локальная библиотека аниме: поиск Shikimori, карточки сезонов, пять статусов, прогресс, заметки и личные оценки.' \
            '' \
            'Профиль, статистика, темы, офлайн-доступ к сохранённым данным, экспорт и импорт JSON. Регистрация не требуется.' \
            '' \
            'Требования: Windows 10/11 x64 и Microsoft Edge WebView2 Runtime. Установщик для текущего пользователя; при отсутствии WebView2 его загрузка требует интернета.' \
            '' \
            'Установщик не подписан цифровым сертификатом.' > release-notes.md
          gh release create "$RELEASE_TAG" "$installer" --verify-tag \
            --title "AnimDesk $version" --notes-file release-notes.md
